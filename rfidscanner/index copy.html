<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Auto Capture with Table</title>
    <style>
        #video {
            width: 320px;
            height: 240px;
            border: 1px solid black;
        }

        #snapshot {
            display: none;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Enter Card</h1>
    <input type="text" id="cardNumber" placeholder="Card Number" autofocus>
    <br>
    <br>
    <video id="video" autoplay></video>
    <canvas id="snapshot" width="320" height="240"></canvas>

    <h2>Data</h2>
    <table id="captureTable">
        <thead>
            <tr>
                <th>Waktu</th>
                <th>Gambar</th>
                <th>Nomor Kartu</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const video = document.getElementById("video");
        const snapshotCanvas = document.getElementById("snapshot");
        const ctx = snapshotCanvas.getContext("2d");
        const captureTable = document.getElementById("captureTable").querySelector("tbody");
        const cardNumberInput = document.getElementById("cardNumber");
        const staticPhoneNumber = "6281371458031"; // Nomor WhatsApp statis

        // Access the webcam
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (error) {
                console.error("Error accessing webcam:", error);
            }
        }

        // Capture image and display in table
        async function captureImage() {
            const cardNumber = cardNumberInput.value.trim(); // Ambil nomor kartu dan hapus spasi
            if (!cardNumber) {
                alert("Nomor kartu tidak boleh kosong!");
                return;
            }

            // Draw video frame to canvas
            ctx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);

            // Convert to data URL
            const dataUrl = snapshotCanvas.toDataURL("image/png");

            // Get current time
            const currentTime = new Date().toLocaleString();

            // Update table with captured data
            addRowToTable(currentTime, dataUrl, cardNumber);

            // Clear the input field
            cardNumberInput.value = "";

            // Play a sound
            const audio = new Audio("terimakasih.mp3");
            audio.play();

            // Send image and card number to WhatsApp
            await sendWhatsAppMessage(staticPhoneNumber, cardNumber, dataUrl);
            return false;
        }

        // Function to add captured data to the table
        function addRowToTable(time, imageUrl, cardNumber) {
            const newRow = document.createElement("tr");
            newRow.innerHTML = `
                <td>${time}</td>
                <td><img src="${imageUrl}" alt="Captured Image" width="100"></td>
                <td>${cardNumber}</td>
            `;
            captureTable.prepend(newRow); // Add new row at the top
        }

        // Send WhatsApp message with captured image
        async function sendWhatsAppMessage(phoneNumber, cardNumber, imageDataUrl) {
            try {
                const response = await fetch("http://localhost:3000/send-image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phoneNumber, cardNumber, imageDataUrl }),
                });

                const result = await response.json();
                if (response.ok) {
                    console.log("Gambar berhasil dikirim ke WhatsApp!");
                } else {
                    console.error(`Gagal mengirim gambar: ${result.message}`);
                }
            } catch (error) {
                console.error("Error saat mengirim gambar:", error);
            }

            return false;
        }

        // Listen for Enter keypress in the input
        cardNumberInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Prevent form submission if inside a form
                captureImage();
            }
        });

        // Auto-focus input when clicking anywhere on the page
        document.addEventListener("click", () => {
            cardNumberInput.focus();
        });

        document.addEventListener("submit", (event) => {
            event.preventDefault(); // Hentikan semua pengiriman form
            console.warn("Form submission prevented.");
        });

        // Initialize webcam
        startWebcam();
    </script>
</body>

</html>
